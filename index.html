<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Trainer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <div class="layout">

        <!-- ЛЕВАЯ КОЛОНКА: ЗАГОЛОВОК И ДОКУМЕНТ -->

        <div class="document-column">

            <h2>Обязательные реквизиты инвойса</h2>

            <!-- ДОКУМЕНТ И ПОЛЗУНОК -->

            <div class="document-wrapper">

                <div class="document" id="document">

                    <!-- ПУСТОЙ БЛАНК -->

                    <img
                        src="images/blank.png"
                        class="invoice-image"
                        alt="Пустой инвойс"
                    >

                    <!-- ЗАПОЛНЕННЫЙ ДОКУМЕНТ -->

                    <div
                        class="completed-layer"
                        id="completedLayer"
                    >

                        <img
                            src="images/completed.png"
                            class="invoice-image"
                            alt="Заполненный инвойс"
                        >

                    </div>

                    <!-- ЗОНЫ ПОДСВЕТКИ -->

                    <div id="markers"></div>

                </div>

                <!-- ВЕРТИКАЛЬНЫЙ СЛАЙДЕР -->

                <div
                    class="slider-track"
                    id="sliderTrack"
                >

                    <div
                        class="slider-handle"
                        id="sliderHandle"
                    >

                        <div class="handle-circle">
                            ▼
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- ПРАВАЯ КОЛОНКА: КАРТОЧКА -->

        <aside
            class="info-panel"
            id="infoPanel"
        >

            <div id="infoContent">

                <strong>Инструкция</strong>

                <p>
                    Передвигайте ползунок, пояснения появятся автоматически.
                </p>
                <p>
                </p>
                <p>
                    Нажимайте кнопку «Закрыть», чтобы увидеть следующие пояснения.
                </p>

            </div>

        </aside>

    </div>

</div>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
