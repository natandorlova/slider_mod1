<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Commercial Invoice</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <h1>Commercial Invoice</h1>

    <p class="subtitle">
        Передвигайте ползунок и изучайте обязательные элементы инвойса
    </p>

    <div class="layout">

        <div class="viewer" id="viewer">

            <!-- нижний слой -->

            <img
                class="image"
                src="images/blank.png"
                alt="Blank invoice"
                draggable="false">

            <!-- верхний слой -->

            <div
                class="overlay"
                id="overlay">

                <img
                    class="image"
                    src="images/completed.png"
                    alt="Completed invoice"
                    draggable="false">

            </div>

            <!-- подсветки -->

            <div id="markers"></div>

            <!-- линия -->

            <div id="divider"></div>

            <!-- ручка -->

            <div id="handle">

                <div class="knob">

                    ⇆

                </div>

            </div>

        </div>

        <!-- карточка -->

        <aside id="panel">

            <h2>

                Обязательные реквизиты

            </h2>

            <div id="content">

                Передвигайте ползунок или нажмите на подсвеченную область.

            </div>

        </aside>

    </div>

</div>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
