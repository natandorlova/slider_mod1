<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice Trainer</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="page">


<h1>
Разбор коммерческого инвойса
</h1>


<p class="subtitle">
Передвигайте ползунок сверху вниз и изучайте обязательные элементы документа
</p>



<div class="layout">



    <!-- ДОКУМЕНТ -->

    <div class="document-wrapper">


        <div class="document" id="document">


            <!-- пустой бланк -->

            <img
            src="images/blank.png"
            class="invoice-image"
            alt="Пустой инвойс">



            <!-- заполненный документ -->

            <div
            class="completed-layer"
            id="completedLayer">


                <img
                src="images/completed.png"
                class="invoice-image"
                alt="Заполненный инвойс">


            </div>



            <!-- зоны подсветки -->

            <div id="markers"></div>



        </div>



        <!-- вертикальный слайдер -->

        <div class="slider-track" id="sliderTrack">


            <div class="slider-handle" id="sliderHandle">


                <div class="handle-circle">
                    ↓
                </div>


            </div>


        </div>



    </div>





    <!-- КАРТОЧКА -->

    <aside class="info-panel" id="infoPanel">


        <div id="infoContent">


            <h2>
            Интерактивный инвойс
            </h2>


            <p>
            Передвигайте ползунок вниз, чтобы открыть обязательные элементы документа.
            </p>


        </div>



    </aside>



</div>



</div>



<script src="data.js"></script>

<script src="script.js"></script>


</body>

</html>
