<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commercial Invoice</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <h1>Commercial Invoice</h1>

    <p class="subtitle">
        Передвигайте ползунок, чтобы увидеть правильное оформление документа
    </p>

    <div class="workspace">

        <!-- ДОКУМЕНТ -->

        <div class="viewer" id="viewer">

            <!-- Пустой документ -->

            <img
                    src="images/blank.png"
                    class="doc blank"
                    draggable="false">

            <!-- Заполненный документ -->

            <div class="reveal" id="reveal">

                <img
                        src="images/completed.png"
                        class="doc completed"
                        draggable="false">

            </div>

            <!-- Зеленые подсветки -->

            <div id="markers"></div>

            <!-- Вертикальная линия -->

            <div id="divider"></div>

            <!-- Ползунок -->

            <div id="handle">

                <div class="handle-circle">

                    ⇆

                </div>

            </div>

        </div>

        <!-- Правая карточка -->

        <aside id="infoCard">

            <button id="closeCard">✕</button>

            <h2>

                Выберите поле

            </h2>

            <p>

                Передвигайте ползунок или нажмите на подсвеченную область.

            </p>

        </aside>

    </div>

</div>

<script src="data.js"></script>

<script src="script.js"></script>

</body>

</html>
